# Minimal GitHub Actions workflow
# Demonstrates triggers, jobs, and steps
# without using any external Action

name: My First Workflow

# 1️⃣ When should it run?
on:
  push:           # every time you push new commits
    branches:["main"]
  push:
    paths:
      - app/**
  workflow_dispatch:

jobs:
  build_smoke_test:          # name of the job
    runs-on: ubuntu-latest   # GitHub provides an Ubuntu VM

    steps:
      # 2️⃣ Every job contains sequential steps
      # Each step runs a shell command on the runner

      - name: checkout_repo
      # effectue le COPY . .
        run: |
          actions/checkout@v6

      - name: build_docker
        run: |
          docker build -t doordash-fee-service .
      
      - name: run_container
        run: |
          docker run -d -p 8089:8090 --name fee-service doordash-fee-service
    
      - name: ckeck_api_connection
        run: |
          echo "Checking API ready on http://localhost:8080 ..."
          for i in {1..10}; do
            echo "test $i"
            if curl -sSf http://localhost:8080/status/ > /dev/null; then
              echo "API is up ✅"
              exit 0
            fi
            echo "API not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "API failed to start ❌"
          docker logs fee-service || true
          exit 1
      - name: Smoke test root endpoint
        run: |
          curl -sSf http://localhost:8080/ || exit 1

      - name: Smoke test status endpoint
        run: |
          curl -sSf http://localhost:8080/status/ || exit 1

      - name: Smoke test estimate-time endpoint
        run: |
          curl -sSf http://localhost:8080/estimate-time/5 || exit 1

      - name: Smoke test calculate-fee endpoint
        run: |
          curl -sSf -X POST http://localhost:8080/calculate-fee/ \
            -H "Content-Type: application/json" \
            -d '{"distance_km": 10.5, "weight_kg": 2.0}' \
            || exit 1

      - name: Show running containers
        run: docker ps

      - name: Show container logs (for debugging)
        if: always()
        run: docker logs fee-service || true

      - name: Stop and remove container
        if: always()
        run: |
          docker stop fee-service || true
          docker rm fee-service || true
          docker ps -a
