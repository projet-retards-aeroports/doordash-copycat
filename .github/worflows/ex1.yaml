name: My First Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fee-service .

      - name: Run container
        run: docker run -d -p 8080:8080 --name fee-service fee-service

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in {1..15}; do
            if curl -sSf http://localhost:8080/status/ > /dev/null; then
              echo "✅ API is up!"
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          echo "❌ API failed to start"
          docker logs fee-service || true
          exit 1

      - name: Smoke tests
        run: |
          curl -sSf http://localhost:8080/ || exit 1
          curl -sSf http://localhost:8080/status/ || exit 1
          curl -sSf http://localhost:8080/estimate-time/5 || exit 1
          curl -sSf -X POST http://localhost:8080/calculate-fee/ \
            -H "Content-Type: application/json" \
            -d '{"distance_km": 10.5, "weight_kg": 2.0}' || exit 1

      - name: Show containers
        if: always()
        run: docker ps -a

      - name: Show logs
        if: always()
        run: docker logs fee-service || true

      - name: Cleanup
        if: always()
        run: |
          docker stop fee-service || true
          docker rm fee-service || true
